{% extends 'base.html' %}




{% block content %}
{% load crispy_forms_tags %}

<div class="row">
<!--    Left Sidebar-->
    <!--    Load the Sidebar here-->

{% include 'sidebar.html' %}

<!--    Right Side Content-->
    <div class="col-md-9">
        {% if perms.auth.add_user %}
        <h2>Edit User</h2>

            {% csrf_token %}

        {% else %}
        <h5>You do not have permission to view this page</h5>
        {% endif %}
        <br>
    </div>



</div>


{% endblock %}
